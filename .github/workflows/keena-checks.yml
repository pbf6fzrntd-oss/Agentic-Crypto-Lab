name: Keena demo checks
on:
  push:
    paths: ['keena-growth-ops/**', '.github/workflows/keena-checks.yml']
  pull_request:
    paths: ['keena-growth-ops/**', '.github/workflows/keena-checks.yml']
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keena-growth-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: keena-growth-ops/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
