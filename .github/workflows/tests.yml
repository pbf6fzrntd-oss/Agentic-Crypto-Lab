name: Tests

# Runs the project's mocked/synthetic test suite only -- no network access,
# no Anthropic API key, no cost. tests/test_integration_live.py hits real
# services and stays self-skipped here (it only runs when
# RUN_LIVE_INTEGRATION_TESTS=1 is set, which this workflow never sets).
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -m pytest tests/ -v
