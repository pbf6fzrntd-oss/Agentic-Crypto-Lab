name: Snapshot methodology checks
on: [push, pull_request]
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_snapshot_v2 -v
      - run: python -m research_v2.demo
      - run: git diff --exit-code -- src output RESEARCH_SPEC.md
