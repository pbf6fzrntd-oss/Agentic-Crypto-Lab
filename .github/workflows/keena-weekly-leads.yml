name: Keena weekly leads refresh

on:
  schedule:
    # Every Monday 12:00 UTC
    - cron: "0 12 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keena-growth-ops
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Pull this week's real leads from the CMS NPI Registry
        run: npm run leads:refresh

      - name: Commit updated pipeline data
        run: |
          git config user.name "keena-growth-ops-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- data/pipeline.json; then
            git add data/pipeline.json
            git commit -m "chore(keena-growth-ops): weekly lead refresh"
            git push
          else
            echo "No pipeline changes to commit."
          fi
